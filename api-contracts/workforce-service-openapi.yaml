# ════════════════════════════════════════════════════════════════════
# COMPONENTS
# ════════════════════════════════════════════════════════════════════
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued JWT token

  # ─────────────── SHARED PARAMETERS ───────────────
  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
      description: Zero-based page number
    SizeParam:
      name: size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      description: Page size
    SortParam:
      name: sort
      in: query
      schema: { type: string }
      description: 'Sort field and direction (e.g., hireDate,desc)'
    WorkerIdPath:
      name: workerId
      in: path
      required: true
      schema: { type: integer }
    GangIdPath:
      name: gangId
      in: path
      required: true
      schema: { type: integer }

  # ─────────────── SHARED RESPONSES ───────────────
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Duplicate resource (unique constraint violation)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ─────────────── SCHEMAS ───────────────
  schemas:

    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    # ══════════ WORKER ══════════
    WorkerCreateRequest:
      type: object
      required: [employeeCode, firstName, lastName, plantationId, categoryCode, employmentTypeCode, hireDate]
      properties:
        employeeCode: { type: string, maxLength: 30 }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }
        nationalId: { type: string, maxLength: 50 }
        passportNumber: { type: string, maxLength: 50 }
        nationality: { type: string, maxLength: 100 }
        ethnicity: { type: string, maxLength: 100 }
        maritalStatus: { type: string, enum: [SINGLE, MARRIED, WIDOWED, DIVORCED] }
        bloodGroup: { type: string, enum: ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] }
        mobilePhone: { type: string, maxLength: 20 }
        alternatePhone: { type: string, maxLength: 20 }
        email: { type: string, maxLength: 200 }
        permanentAddress: { type: string }
        currentAddress: { type: string }
        plantationId: { type: integer }
        divisionId: { type: integer }
        categoryCode: { type: string, description: 'Lookup code from lu_worker_category' }
        employmentTypeCode: { type: string, description: 'Lookup code from lu_employment_type' }
        workerStatus: { type: string, default: 'PROBATION', description: 'Lookup code from lu_worker_status' }
        hireDate: { type: string, format: date }
        probationEndDate: { type: string, format: date }
        reportsToId: { type: integer }
        primaryFieldId: { type: integer }
        assignedGangId: { type: integer }
        basePayAmount: { type: number, format: double }
        payCurrency: { type: string, default: 'LKR' }
        payFrequency: { type: string, enum: [DAILY, WEEKLY, BIWEEKLY, MONTHLY] }
        bankName: { type: string, maxLength: 200 }
        bankAccountNo: { type: string, maxLength: 50 }
        bankBranch: { type: string, maxLength: 200 }
        biometricId: { type: string, maxLength: 100 }
        nfcBadgeUid: { type: string, maxLength: 100 }
        gpsWearableUid: { type: string, maxLength: 100 }
        photoUrl: { type: string }
        remarks: { type: string }

    WorkerUpdateRequest:
      type: object
      properties:
        dateOfBirth: { type: string, format: date }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }
