openapi: 3.0.3
info:
  title: RPMS Workforce Service API
  description: |
    Module 4 — Workforce Management.
    Manages worker registration, employment lifecycle, gang/team organization,
    skill competency matrix, field assignment history, leave management,
    training records, pay structure, next-of-kin, document management, and
    occupational health & safety incidents.

    **Key entity**: `worker` is the central record referenced by `tapper_id`
    in Module 3 (tapping) and `worker_id` in Modules 5 (activity) and 6
    (attendance).

    **Framework**: Spring Boot 3 + Java 21 (ADR-002)
    **Database**: PostgreSQL 16 (ADR-001)
    **Repo**: rpms-mod-workforce
    **Depends on**: Module 1 (plantation, division, field)
  version: 1.0.0
  contact:
    name: RPMS Architecture Team
  license:
    name: Proprietary

servers:
  - url: /api/workforce
    description: Behind API Gateway (rpms-platform)

security:
  - BearerAuth: []

tags:
  - name: Workers
    description: Core workforce entity — every employee, tapper, supervisor, manager
  - name: Gangs
    description: Tapper gangs / teams assigned to fields
  - name: Worker Skills
    description: Skill competency matrix per worker
  - name: Field Assignments
    description: Historical field/gang assignment tracking
  - name: Next of Kin
    description: Emergency contacts and beneficiaries
  - name: Documents
    description: Worker documents — IDs, certificates, contracts
  - name: Leave
    description: Leave applications, approval workflow, and balances
  - name: Training
    description: Training history — classroom, field, VR/MR, e-learning
  - name: Pay Structure
    description: Pay component structure per worker
  - name: Safety Incidents
    description: Occupational health & safety incident records
  - name: Analytics
    description: Cross-worker analytical views
  - name: Lookups
    description: Read-only reference data

# ════════════════════════════════════════════════════════════════════
# PATHS
# ════════════════════════════════════════════════════════════════════
paths:

  # ─────────────────────── WORKERS ───────────────────────
  /workers:
    get:
      tags: [Workers]
      summary: List workers (filterable across plantation/division/category/status)
      operationId: listWorkers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: plantationId
          in: query
          schema: { type: integer }
        - name: divisionId
          in: query
          schema: { type: integer }
        - name: fieldId
          in: query
          schema: { type: integer }
        - name: gangId
          in: query
          schema: { type: integer }
        - name: categoryCode
          in: query
          schema: { type: string }
          description: Lookup code from lu_worker_category
        - name: employmentTypeCode
          in: query
          schema: { type: string }
          description: Lookup code from lu_employment_type
        - name: workerStatus
          in: query
          schema: { type: string }
          description: Lookup code from lu_worker_status
        - name: search
          in: query
          schema: { type: string }
          description: Free-text match on employeeCode / fullName
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedWorkerResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Workers]
      summary: Register a new worker
      operationId: createWorker
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workers/{workerId}:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
    get:
      tags: [Workers]
      summary: Get worker by ID
      operationId: getWorker
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Workers]
      summary: Update a worker
      description: |
        Changing `workerStatus` auto-appends an immutable record to
        `worker_status_change_log` via a DB trigger.
      operationId: updateWorker
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workers/{workerId}/profile:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
    get:
      tags: [Workers]
      summary: Get full worker profile (from vw_worker_profile)
      operationId: getWorkerProfile
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workers/{workerId}/status-history:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
    get:
      tags: [Workers]
      summary: List status change history (immutable — auto-logged by DB trigger on status change)
      operationId: listWorkerStatusHistory
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedWorkerStatusLogResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── WORKER SKILLS ───────────────────────
  /workers/{workerId}/skills:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
    get:
      tags: [Worker Skills]
      summary: List a worker's skill competency matrix
      operationId: listWorkerSkills
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedWorkerSkillResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Worker Skills]
      summary: Record a skill assessment for a worker
      operationId: createWorkerSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerSkillCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerSkillResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workers/{workerId}/skills/{skillId}:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
      - name: skillId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Worker Skills]
      summary: Update a skill assessment (re-assessment, certification)
      operationId: updateWorkerSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerSkillUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerSkillResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── FIELD ASSIGNMENTS ───────────────────────
  /workers/{workerId}/field-assignments:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
    get:
      tags: [Field Assignments]
      summary: List a worker's field assignment history
      operationId: listWorkerFieldAssignments
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedFieldAssignmentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Field Assignments]
      summary: Assign a worker to a field (and optionally a gang)
      operationId: createWorkerFieldAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldAssignmentCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldAssignmentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─────────────────────── NEXT OF KIN ───────────────────────
  /workers/{workerId}/next-of-kin:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
    get:
      tags: [Next of Kin]
      summary: List a worker's next-of-kin / emergency contacts
      operationId: listNextOfKin
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedNextOfKinResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Next of Kin]
      summary: Add a next-of-kin / beneficiary record
      operationId: createNextOfKin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NextOfKinCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NextOfKinResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workers/{workerId}/next-of-kin/{kinId}:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
      - name: kinId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Next of Kin]
      summary: Update a next-of-kin record
      operationId: updateNextOfKin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NextOfKinCreateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NextOfKinResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── DOCUMENTS ───────────────────────
  /workers/{workerId}/documents:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
    get:
      tags: [Documents]
      summary: List a worker's documents
      operationId: listWorkerDocuments
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, EXPIRED, REVOKED, PENDING_VERIFICATION] }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedWorkerDocumentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Documents]
      summary: Upload a worker document
      operationId: createWorkerDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerDocumentCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerDocumentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workers/{workerId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
      - name: documentId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Documents]
      summary: Update / verify a worker document
      operationId: updateWorkerDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerDocumentUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerDocumentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── LEAVE ───────────────────────
  /workers/{workerId}/leave:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
    get:
      tags: [Leave]
      summary: List a worker's leave applications
      operationId: listWorkerLeave
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: approvalStatus
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED] }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedWorkerLeaveResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Leave]
      summary: Submit a leave application
      operationId: createWorkerLeave
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerLeaveCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerLeaveResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workers/{workerId}/leave/{leaveId}:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
      - name: leaveId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Leave]
      summary: Approve, reject, or cancel a leave application
      description: |
        Transitioning `approvalStatus` to APPROVED or back to PENDING
        auto-updates `worker_leave_balance.taken_days` / `pending_days`
        via a DB trigger.
      operationId: updateWorkerLeave
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerLeaveUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerLeaveResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workers/{workerId}/leave-balance:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
    get:
      tags: [Leave]
      summary: List a worker's leave balances (per leave type per year)
      operationId: listWorkerLeaveBalance
      parameters:
        - name: balanceYear
          in: query
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkerLeaveBalanceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── TRAINING ───────────────────────
  /workers/{workerId}/training:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
    get:
      tags: [Training]
      summary: List a worker's training history
      operationId: listWorkerTraining
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedWorkerTrainingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Training]
      summary: Record a training enrollment
      operationId: createWorkerTraining
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerTrainingCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerTrainingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workers/{workerId}/training/{trainingId}:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
      - name: trainingId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Training]
      summary: Update training outcome / assessment / certification
      operationId: updateWorkerTraining
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerTrainingUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerTrainingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── PAY STRUCTURE ───────────────────────
  /workers/{workerId}/pay-structure:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
    get:
      tags: [Pay Structure]
      summary: List a worker's pay component structure
      operationId: listWorkerPayStructure
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedPayStructureResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Pay Structure]
      summary: Add a pay component to a worker's structure
      operationId: createWorkerPayStructure
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayStructureCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayStructureResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workers/{workerId}/pay-structure/{payStructureId}:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
      - name: payStructureId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Pay Structure]
      summary: Update / end-date a pay component
      operationId: updateWorkerPayStructure
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayStructureUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayStructureResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── SAFETY INCIDENTS ───────────────────────
  /workers/{workerId}/safety-incidents:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
    get:
      tags: [Safety Incidents]
      summary: List a worker's safety incidents
      operationId: listWorkerSafetyIncidents
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedSafetyIncidentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Safety Incidents]
      summary: Report a safety incident
      operationId: createSafetyIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SafetyIncidentCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafetyIncidentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workers/{workerId}/safety-incidents/{incidentId}:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
      - name: incidentId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Safety Incidents]
      summary: Update investigation / corrective action on a safety incident
      operationId: updateSafetyIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SafetyIncidentUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafetyIncidentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── GANGS ───────────────────────
  /gangs:
    get:
      tags: [Gangs]
      summary: List gangs (filterable by plantation/division/field/status)
      operationId: listGangs
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: plantationId
          in: query
          schema: { type: integer }
        - name: divisionId
          in: query
          schema: { type: integer }
        - name: fieldId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, DISBANDED] }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedGangResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Gangs]
      summary: Create a gang / team
      operationId: createGang
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GangCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GangResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /gangs/{gangId}:
    parameters:
      - $ref: '#/components/parameters/GangIdPath'
    get:
      tags: [Gangs]
      summary: Get gang by ID
      operationId: getGang
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GangResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Gangs]
      summary: Update a gang
      description: |
        `currentSize` is read-only — it is auto-synced from `worker.assigned_gang_id`
        membership via a DB trigger and cannot be set directly.
      operationId: updateGang
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GangUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GangResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /gangs/{gangId}/roster-summary:
    parameters:
      - $ref: '#/components/parameters/GangIdPath'
    get:
      tags: [Gangs]
      summary: Get gang roster summary (from vw_gang_roster)
      description: Aggregated member counts and role mix. For the member list itself, use `GET /workers?gangId={gangId}`.
      operationId: getGangRosterSummary
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GangRosterResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── ANALYTICS ───────────────────────
  /analytics/expiring-documents:
    get:
      tags: [Analytics]
      summary: Documents expired, expiring soon, or due for renewal (from vw_expiring_documents)
      operationId: getExpiringDocuments
      parameters:
        - name: plantationCode
          in: query
          schema: { type: string }
        - name: alertLevel
          in: query
          schema: { type: string, enum: [EXPIRED, EXPIRING_SOON, DUE_FOR_RENEWAL, OK] }
      responses:
