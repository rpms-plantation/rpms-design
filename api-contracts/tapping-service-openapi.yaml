        aiYieldPredictionKg: { type: number, format: double, readOnly: true }
        aiQualityFlags: { type: string, readOnly: true }
        blockchainTxHash: { type: string, readOnly: true }
        remarks: { type: string }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        createdBy: { type: string, readOnly: true }
        updatedBy: { type: string, readOnly: true }

    PagedTappingTaskResponse:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/TappingTaskResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
