        status: { type: string, description: 'Lookup code from lu_tapping_task_status' }
        actualStartTime: { type: string, format: date-time }
        actualEndTime: { type: string, format: date-time }
        startGpsLatitude: { type: number, format: double, minimum: -90, maximum: 90 }
        startGpsLongitude: { type: number, format: double, minimum: -180, maximum: 180 }
        endGpsLatitude: { type: number, format: double, minimum: -90, maximum: 90 }
        endGpsLongitude: { type: number, format: double, minimum: -180, maximum: 180 }
        treesTapped: { type: integer, minimum: 0 }
        treesSkipped: { type: integer, minimum: 0 }
        treesWithTpd: { type: integer, minimum: 0 }
        treesDryPanel: { type: integer, minimum: 0 }
        totalLatexKg: { type: number, format: double }
        totalCupLumpKg: { type: number, format: double }
        totalTreeLaceKg: { type: number, format: double }
        avgDrcPct: { type: number, format: double }
        skipReasonCode: { type: string, description: 'Lookup code from lu_tapping_skip_reason' }
        skipRemarks: { type: string }
        weatherTempC: { type: number, format: double }
        weatherHumidityPct: { type: number, format: double }
        weatherRainfallMm: { type: number, format: double }
        weatherCondition: { type: string, enum: [CLEAR, CLOUDY, LIGHT_RAIN, HEAVY_RAIN, DRIZZLE, FOG, WINDY] }
        smartKnifeDeviceId: { type: string, maxLength: 50 }
        gpsWearableId: { type: string, maxLength: 50 }
        geofenceVerified: { type: boolean }
        tappingQualityScore: { type: number, format: double, minimum: 0, maximum: 10 }
        cutAngleDeviationDeg: { type: number, format: double }
        barkConsumptionNote: { type: string, maxLength: 100 }
        supervisorVerified: { type: boolean }
        verifiedBy: { type: string, maxLength: 100 }
        remarks: { type: string }

    TappingTaskResponse:
      type: object
      properties:
        taskId: { type: integer, format: int64, readOnly: true }
        plantationId: { type: integer }
        fieldId: { type: integer }
        divisionId: { type: integer }
        scheduleId: { type: integer }
        taskDate: { type: string, format: date }
        tapperId: { type: integer }
        tapperName: { type: string }
        assignedBy: { type: string }
        assignedAt: { type: string, format: date-time, readOnly: true }
        tappingSystemCode: { type: string }
        tappingSystemName: { type: string }
        panelCode: { type: string }
        status: { type: string }
        statusName: { type: string }
        actualStartTime: { type: string, format: date-time }
        actualEndTime: { type: string, format: date-time }
        startGpsLatitude: { type: number, format: double }
        startGpsLongitude: { type: number, format: double }
        endGpsLatitude: { type: number, format: double }
        endGpsLongitude: { type: number, format: double }
        totalTreesAssigned: { type: integer }
        treesTapped: { type: integer }
        treesSkipped: { type: integer }
        treesWithTpd: { type: integer }
        treesDryPanel: { type: integer }
        totalLatexKg: { type: number, format: double }
        totalCupLumpKg: { type: number, format: double }
        totalTreeLaceKg: { type: number, format: double }
        totalYieldKg: { type: number, format: double, readOnly: true, description: 'Auto-calculated: sum of latex + cup lump + tree lace' }
        yieldPerTreeG: { type: number, format: double, readOnly: true, description: 'Auto-calculated: totalYieldKg / treesTapped * 1000' }
        avgDrcPct: { type: number, format: double }
        skipReasonCode: { type: string }
        skipReasonName: { type: string }
        skipRemarks: { type: string }
        weatherTempC: { type: number, format: double }
        weatherHumidityPct: { type: number, format: double }
        weatherRainfallMm: { type: number, format: double }
        weatherCondition: { type: string }
        smartKnifeDeviceId: { type: string }
        gpsWearableId: { type: string }
        geofenceVerified: { type: boolean }
        tappingQualityScore: { type: number, format: double }
        cutAngleDeviationDeg: { type: number, format: double }
        barkConsumptionNote: { type: string }
        supervisorVerified: { type: boolean }
        verifiedBy: { type: string }
