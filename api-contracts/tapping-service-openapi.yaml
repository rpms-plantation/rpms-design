openapi: 3.0.3
info:
  title: RPMS Tapping Service API
  description: |
    Module 3 — Tapping Task Monitoring.
    Manages the recurring tapping calendar, daily tapping task assignment and
    execution tracking, latex collection and quality testing, collection point
    registry, IoT device registry and telemetry, weather observations, and
    tapper/field performance analytics.

    **Spatial**: PostGIS Point on `tapping_task` (start location), `collection_point`,
    and `iot_device` (auto-synced from lat/lon by a DB trigger). GPS coordinates
    exposed as latitude/longitude pairs in DTOs.

    **High-volume telemetry**: `iot_sensor_reading` is a monthly-partitioned table.
    List queries require a time range (`from`/`to`) — never query unbounded.

    **Framework**: Quarkus 3 + Java 21 (ADR-002)
    **Database**: PostgreSQL 16 + PostGIS (ADR-001)
    **Repo**: rpms-mod-tapping
    **Depends on**: Module 1 (plantation, division, field, lu_tapping_system),
    Module 2 (tree), Module 4 (worker — tapper_id is a cross-module ID reference only)
  version: 1.0.0
  contact:
    name: RPMS Architecture Team
  license:
    name: Proprietary

servers:
  - url: /api/tapping
    description: Behind API Gateway (rpms-platform)

security:
  - BearerAuth: []

tags:
  - name: Tapping Schedules
    description: Recurring tapping calendar per field
  - name: Tapping Tasks
    description: Daily operational task — one tapper x one field x one day
  - name: Tree Details
    description: Optional tree-level tapping detail via NFC scanning (immutable)
  - name: Collection Points
    description: Physical latex receiving/weighing stations
  - name: Latex Collection
    description: Physical latex collection records — weights, DRC, provenance
  - name: Quality Tests
    description: Lab/field quality test results on collected latex (immutable)
  - name: IoT Devices
    description: Smart knives, rain gauges, scales, GPS wearables
  - name: IoT Readings
    description: High-volume device telemetry (immutable, time-partitioned)
  - name: Weather
    description: Daily field/plantation weather observations (immutable)
  - name: Analytics
    description: Cross-task analytical views and daily rollups
  - name: Lookups
    description: Read-only reference data

# ════════════════════════════════════════════════════════════════════
# PATHS
# ════════════════════════════════════════════════════════════════════
paths:

  # ─────────────────────── TAPPING SCHEDULES ───────────────────────
  /tapping-schedules:
    get:
      tags: [Tapping Schedules]
      summary: List tapping schedules
      operationId: listTappingSchedules
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: plantationId
          in: query
          schema: { type: integer }
        - name: fieldId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, SUSPENDED, COMPLETED] }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedTappingScheduleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tapping Schedules]
      summary: Create a tapping schedule
      operationId: createTappingSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TappingScheduleCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TappingScheduleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tapping-schedules/{scheduleId}:
    parameters:
      - $ref: '#/components/parameters/ScheduleIdPath'
    get:
      tags: [Tapping Schedules]
      summary: Get schedule by ID
      operationId: getTappingSchedule
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TappingScheduleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tapping Schedules]
      summary: Update a tapping schedule
      operationId: updateTappingSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TappingScheduleUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TappingScheduleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── TAPPING TASKS ───────────────────────
  /tapping-tasks:
    get:
      tags: [Tapping Tasks]
      summary: List tapping tasks (filterable across plantation/field/tapper/date/status)
      operationId: listTappingTasks
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: plantationId
          in: query
          schema: { type: integer }
        - name: fieldId
          in: query
          schema: { type: integer }
        - name: tapperId
          in: query
          schema: { type: integer }
        - name: taskDate
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string, description: 'Lookup code from lu_tapping_task_status' }
        - $ref: '#/components/parameters/LatParam'
        - $ref: '#/components/parameters/LonParam'
        - $ref: '#/components/parameters/RadiusKmParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedTappingTaskResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tapping Tasks]
      summary: Create / assign a tapping task
      operationId: createTappingTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TappingTaskCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TappingTaskResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tapping-tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskIdPath'
    get:
      tags: [Tapping Tasks]
      summary: Get task by ID
      operationId: getTappingTask
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TappingTaskResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tapping Tasks]
      summary: Update task execution / completion details
      description: |
        Updating `totalLatexKg`/`totalCupLumpKg`/`totalTreeLaceKg`/`treesTapped`
        auto-recalculates the read-only `totalYieldKg`/`yieldPerTreeG` fields via
        a DB trigger (fn_calc_task_yield_metrics) when status is COMPLETED or PARTIAL.
        Setting `startGpsLatitude`/`startGpsLongitude` auto-syncs the PostGIS point.
      operationId: updateTappingTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TappingTaskUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TappingTaskResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── TREE DETAILS ───────────────────────
  /tapping-tasks/{taskId}/tree-details:
    parameters:
      - $ref: '#/components/parameters/TaskIdPath'
    get:
      tags: [Tree Details]
      summary: List tree-level tapping details for a task (NFC scan records)
      operationId: listTaskTreeDetails
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedTreeDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tree Details]
      summary: Record a tree-level tapping result (immutable — append-only, typically via NFC scan)
      operationId: createTaskTreeDetail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreeDetailCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─────────────────────── COLLECTION POINTS ───────────────────────
  /collection-points:
    get:
      tags: [Collection Points]
      summary: List collection points
      operationId: listCollectionPoints
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: plantationId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, MAINTENANCE] }
        - $ref: '#/components/parameters/LatParam'
        - $ref: '#/components/parameters/LonParam'
        - $ref: '#/components/parameters/RadiusKmParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedCollectionPointResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Collection Points]
      summary: Register a collection point
      operationId: createCollectionPoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionPointCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionPointResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /collection-points/{pointId}:
    parameters:
      - $ref: '#/components/parameters/PointIdPath'
    get:
      tags: [Collection Points]
      summary: Get collection point by ID
      operationId: getCollectionPoint
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionPointResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Collection Points]
      summary: Update a collection point
      operationId: updateCollectionPoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionPointUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionPointResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── LATEX COLLECTION ───────────────────────
  /latex-collection-records:
    get:
      tags: [Latex Collection]
      summary: List latex collection records
      operationId: listLatexCollectionRecords
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: taskId
          in: query
          schema: { type: integer, format: int64 }
        - name: fieldId
          in: query
          schema: { type: integer }
        - name: collectionDate
          in: query
          schema: { type: string, format: date }
        - name: latexGradeCode
          in: query
          schema: { type: string }
        - name: collectionPointId
          in: query
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedLatexCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Latex Collection]
      summary: Record a latex collection
      description: |
        `netWeightKg` and `dryRubberKg` are server-computed by a DB trigger
        (fn_calc_dry_rubber) from `grossWeightKg`, `containerWeightKg`, and
        `drcPct` — do not send them; any value sent is overwritten.
      operationId: createLatexCollectionRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LatexCollectionCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LatexCollectionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /latex-collection-records/{collectionId}:
    parameters:
      - $ref: '#/components/parameters/CollectionIdPath'
    get:
      tags: [Latex Collection]
      summary: Get collection record by ID
      operationId: getLatexCollectionRecord
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LatexCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Latex Collection]
      summary: Correct a latex collection record
      operationId: updateLatexCollectionRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LatexCollectionUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LatexCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── QUALITY TESTS ───────────────────────
  /latex-collection-records/{collectionId}/quality-tests:
    parameters:
      - $ref: '#/components/parameters/CollectionIdPath'
    get:
      tags: [Quality Tests]
      summary: List quality test results for a collection record
      operationId: listQualityTests
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedQualityTestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Quality Tests]
      summary: Record a quality test result (immutable — append-only)
      description: |
        `isWithinSpec` and `deviationPct` are server-computed by a DB trigger
        (fn_check_quality_spec) against `lu_quality_parameter`'s acceptable range.
      operationId: createQualityTest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualityTestCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityTestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── IOT DEVICES ───────────────────────
  /iot-devices:
    get:
      tags: [IoT Devices]
      summary: List IoT devices
      operationId: listIotDevices
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: plantationId
          in: query
          schema: { type: integer }
        - name: fieldId
          in: query
          schema: { type: integer }
        - name: deviceTypeCode
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, MAINTENANCE, LOST, DECOMMISSIONED] }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedIotDeviceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [IoT Devices]
      summary: Register an IoT device
      operationId: createIotDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IotDeviceCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IotDeviceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /iot-devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceIdPath'
    get:
      tags: [IoT Devices]
      summary: Get device by ID
      operationId: getIotDevice
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IotDeviceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [IoT Devices]
      summary: Update device assignment / status / heartbeat
      operationId: updateIotDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IotDeviceUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IotDeviceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── IOT READINGS ───────────────────────
  /iot-devices/{deviceId}/readings:
    parameters:
      - $ref: '#/components/parameters/DeviceIdPath'
    get:
      tags: [IoT Readings]
      summary: List telemetry readings for a device within a time range
      description: |
        `iot_sensor_reading` is partitioned by month — `from` and `to` are
        required to avoid an unbounded scan across partitions.
      operationId: listIotReadings
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedIotReadingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [IoT Readings]
      summary: Ingest a telemetry reading (immutable — append-only)
      operationId: createIotReading
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IotReadingCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IotReadingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── WEATHER ───────────────────────
  /weather-observations:
    get:
      tags: [Weather]
      summary: List weather observations
      operationId: listWeatherObservations
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: plantationId
          in: query
          schema: { type: integer }
        - name: fieldId
          in: query
          schema: { type: integer }
        - name: observationDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedWeatherObservationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Weather]
      summary: Record a weather observation (immutable — append-only)
      operationId: createWeatherObservation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeatherObservationCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeatherObservationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─────────────────────── ANALYTICS ───────────────────────
  /analytics/tapping-dashboard:
    get:
      tags: [Analytics]
      summary: Daily tapping dashboard (from vw_tapping_dashboard_daily)
      operationId: getTappingDashboard
      parameters:
        - name: taskDate
          in: query
          schema: { type: string, format: date }
        - name: plantationCode
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TappingDashboardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics/tapper-performance-ranking:
    get:
      tags: [Analytics]
      summary: Tapper performance ranking (from vw_tapper_performance_ranking)
      operationId: getTapperPerformanceRanking
      parameters:
        - name: plantationCode
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TapperPerformanceRankingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics/tapper-performance-daily:
    get:
      tags: [Analytics]
      summary: Daily per-tapper performance rollup (read-only, computed by scheduled aggregation)
      operationId: listTapperPerformanceDaily
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: tapperId
          in: query
          schema: { type: integer }
        - name: performanceDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedTapperPerformanceDailyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics/clone-yield:
    get:
      tags: [Analytics]
      summary: Clone-wise yield analysis (from vw_clone_yield_analysis)
      operationId: getCloneYieldAnalysis
      parameters:
        - name: plantationCode
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CloneYieldResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics/field-yield-daily:
    get:
      tags: [Analytics]
      summary: Daily per-field yield rollup (read-only, computed by scheduled aggregation)
      operationId: listFieldYieldDaily
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: fieldId
          in: query
          schema: { type: integer }
        - name: yieldDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedFieldYieldDailyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics/weather-yield-correlation:
    get:
      tags: [Analytics]
      summary: Weather impact on yield (from vw_weather_yield_correlation)
      operationId: getWeatherYieldCorrelation
      parameters:
        - name: plantationCode
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WeatherYieldCorrelationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── LOOKUPS ───────────────────────
  /lookups/tapping-task-statuses:
    get:
      tags: [Lookups]
      summary: List tapping task status lookup
      operationId: listTappingTaskStatuses
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TappingTaskStatusLookup' }

  /lookups/latex-grades:
    get:
      tags: [Lookups]
      summary: List latex grade lookup
      operationId: listLatexGrades
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
