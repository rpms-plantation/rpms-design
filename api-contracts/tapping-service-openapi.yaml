# ════════════════════════════════════════════════════════════════════
# COMPONENTS
# ════════════════════════════════════════════════════════════════════
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued JWT token

  # ─────────────── SHARED PARAMETERS ───────────────
  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
      description: Zero-based page number
    SizeParam:
      name: size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      description: Page size
    SortParam:
      name: sort
      in: query
      schema: { type: string }
      description: 'Sort field and direction (e.g., taskDate,desc)'
    LatParam:
      name: lat
      in: query
      schema: { type: number, format: double, minimum: -90, maximum: 90 }
      description: Latitude for spatial proximity filter
    LonParam:
      name: lon
      in: query
      schema: { type: number, format: double, minimum: -180, maximum: 180 }
      description: Longitude for spatial proximity filter
    RadiusKmParam:
      name: radiusKm
      in: query
      schema: { type: number, format: double, default: 10 }
      description: Search radius in kilometers (requires lat + lon)
    ScheduleIdPath:
      name: scheduleId
      in: path
      required: true
      schema: { type: integer }
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PointIdPath:
      name: pointId
      in: path
      required: true
      schema: { type: integer }
    CollectionIdPath:
      name: collectionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      schema: { type: integer }

  # ─────────────── SHARED RESPONSES ───────────────
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Duplicate resource (unique constraint violation)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ─────────────── SCHEMAS ───────────────
  schemas:

    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    # ══════════ TAPPING SCHEDULE ══════════
    TappingScheduleCreateRequest:
      type: object
      required: [plantationId, fieldId, tappingSystemCode, frequencyDays, effectiveFrom]
      properties:
        plantationId: { type: integer }
        fieldId: { type: integer }
        scheduleName: { type: string, maxLength: 100 }
        tappingSystemCode: { type: string, description: 'Lookup code from lu_tapping_system' }
        frequencyDays: { type: integer, minimum: 1, maximum: 7, description: 'd2=2, d3=3, d4=4' }
        tappingDays: { type: string, maxLength: 50, description: "e.g. 'MON,WED,FRI'" }
        expectedStartTime: { type: string, format: time, default: '04:30:00' }
        expectedEndTime: { type: string, format: time, default: '09:00:00' }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        targetTreesPerDay: { type: integer }
        targetYieldKgPerDay: { type: number, format: double }
        rainCutoffMm: { type: number, format: double, default: 5.0 }
        minDryHours: { type: number, format: double, default: 3.0 }
        remarks: { type: string }

    TappingScheduleUpdateRequest:
      type: object
      properties:
        scheduleName: { type: string, maxLength: 100 }
        tappingDays: { type: string, maxLength: 50 }
        expectedStartTime: { type: string, format: time }
        expectedEndTime: { type: string, format: time }
        effectiveTo: { type: string, format: date }
        targetTreesPerDay: { type: integer }
        targetYieldKgPerDay: { type: number, format: double }
        rainCutoffMm: { type: number, format: double }
        minDryHours: { type: number, format: double }
        status: { type: string, enum: [ACTIVE, SUSPENDED, COMPLETED] }
        remarks: { type: string }

    TappingScheduleResponse:
      type: object
      properties:
        scheduleId: { type: integer, readOnly: true }
        plantationId: { type: integer }
        fieldId: { type: integer }
        scheduleName: { type: string }
        tappingSystemCode: { type: string }
        tappingSystemName: { type: string }
        frequencyDays: { type: integer }
        tappingDays: { type: string }
        expectedStartTime: { type: string, format: time }
        expectedEndTime: { type: string, format: time }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        targetTreesPerDay: { type: integer }
        targetYieldKgPerDay: { type: number, format: double }
        rainCutoffMm: { type: number, format: double }
        minDryHours: { type: number, format: double }
        status: { type: string }
        remarks: { type: string }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        createdBy: { type: string, readOnly: true }

    PagedTappingScheduleResponse:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/TappingScheduleResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    # ══════════ TAPPING TASK ══════════
    TappingTaskCreateRequest:
      type: object
      required: [plantationId, fieldId, taskDate, tappingSystemCode]
      properties:
        plantationId: { type: integer }
        fieldId: { type: integer }
        divisionId: { type: integer }
        scheduleId: { type: integer }
        taskDate: { type: string, format: date }
        tapperId: { type: integer, description: 'Cross-module reference to worker.worker_id (Module 4)' }
        tapperName: { type: string, maxLength: 200 }
        assignedBy: { type: string, maxLength: 100 }
        tappingSystemCode: { type: string, description: 'Lookup code from lu_tapping_system' }
        panelCode: { type: string, maxLength: 20 }
        totalTreesAssigned: { type: integer, minimum: 0 }
        remarks: { type: string }

    TappingTaskUpdateRequest:
