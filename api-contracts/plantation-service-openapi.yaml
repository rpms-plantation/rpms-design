# ════════════════════════════════════════════════════════════════════
# COMPONENTS
# ════════════════════════════════════════════════════════════════════
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued JWT token

  # ─────────────── SHARED PARAMETERS ───────────────
  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
      description: Zero-based page number
    SizeParam:
      name: size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      description: Page size
    SortParam:
      name: sort
      in: query
      schema: { type: string }
      description: 'Sort field and direction (e.g., plantationCode,asc or areaHa,desc)'
    LatParam:
      name: lat
      in: query
      schema: { type: number, format: double, minimum: -90, maximum: 90 }
      description: Latitude for spatial proximity filter
    LonParam:
      name: lon
      in: query
      schema: { type: number, format: double, minimum: -180, maximum: 180 }
      description: Longitude for spatial proximity filter
    RadiusKmParam:
      name: radiusKm
      in: query
      schema: { type: number, format: double, default: 10 }
      description: Search radius in kilometers (requires lat + lon)
    PlantationIdPath:
      name: plantationId
      in: path
      required: true
      schema: { type: integer }
    DivisionIdPath:
      name: divisionId
      in: path
      required: true
      schema: { type: integer }
    FieldIdPath:
      name: fieldId
      in: path
      required: true
      schema: { type: integer }

  # ─────────────── SHARED RESPONSES ───────────────
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Duplicate resource (unique constraint violation)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ─────────────── SCHEMAS ───────────────
  schemas:

    # ── Pagination wrapper ──
    PageMetadata:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    # ── Error ──
    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    # ══════════ PLANTATION ══════════
    PlantationCreateRequest:
      type: object
      required: [plantationCode, plantationName, totalSurfaceArea, measurementUnit]
      properties:
        plantationCode: { type: string, maxLength: 20 }
        plantationName: { type: string, maxLength: 200 }
        companyName: { type: string, maxLength: 200 }
        region: { type: string, maxLength: 100 }
        district: { type: string, maxLength: 100 }
        country: { type: string, maxLength: 100 }
        address: { type: string }
        totalSurfaceArea: { type: number, format: double, minimum: 0, exclusiveMinimum: true }
        measurementUnit: { type: string, description: 'Lookup code from lu_measurement_unit (e.g., HA, AC)' }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        elevationM: { type: number, format: double }
        avgAnnualRainfallMm: { type: number, format: double }
        soilType: { type: string, maxLength: 100 }
        climateZone: { type: string, maxLength: 50 }
        remarks: { type: string }

    PlantationUpdateRequest:
      type: object
      properties:
        plantationName: { type: string, maxLength: 200 }
        companyName: { type: string, maxLength: 200 }
        region: { type: string, maxLength: 100 }
        district: { type: string, maxLength: 100 }
        country: { type: string, maxLength: 100 }
        address: { type: string }
        totalSurfaceArea: { type: number, format: double, minimum: 0, exclusiveMinimum: true }
        measurementUnit: { type: string }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        elevationM: { type: number, format: double }
        avgAnnualRainfallMm: { type: number, format: double }
        soilType: { type: string, maxLength: 100 }
        climateZone: { type: string, maxLength: 50 }
        status: { type: string, enum: [ACTIVE, INACTIVE, DECOMMISSIONED] }
        remarks: { type: string }

    PlantationResponse:
      type: object
      properties:
        plantationId: { type: integer, readOnly: true }
        plantationCode: { type: string }
        plantationName: { type: string }
        companyName: { type: string }
        region: { type: string }
        district: { type: string }
        country: { type: string }
        address: { type: string }
        totalSurfaceArea: { type: number, format: double }
        measurementUnit: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        elevationM: { type: number, format: double }
        avgAnnualRainfallMm: { type: number, format: double }
        soilType: { type: string }
        climateZone: { type: string }
        status: { type: string }
        remarks: { type: string }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        createdBy: { type: string, readOnly: true }
        updatedBy: { type: string, readOnly: true }

    PagedPlantationResponse:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/PlantationResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

