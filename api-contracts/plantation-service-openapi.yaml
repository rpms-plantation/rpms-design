openapi: 3.0.3
info:
  title: RPMS Plantation Service API
  description: |
    Module 1 — Plantation Field Records Management.
    Manages plantations, divisions, fields/blocks, nurseries, clone catalog,
    land use classification, field lifecycle history, and annual area snapshots.
    
    This is the foundation module — plantation_id, division_id, and field_id are
    referenced by all other RPMS modules (M2–M6).
    
    **Spatial**: PostGIS Polygon boundaries on plantation, field, and nursery.
    GPS coordinates exposed as latitude/longitude pairs in DTOs.
    
    **Framework**: Spring Boot 3 + Java 21 (ADR-002)
    **Database**: PostgreSQL 16 + PostGIS (ADR-001)
    **Repo**: rpms-mod-plantation
  version: 1.0.0
  contact:
    name: RPMS Architecture Team
  license:
    name: Proprietary

servers:
  - url: /api/plantation
    description: Behind API Gateway (rpms-platform)

security:
  - BearerAuth: []

tags:
  - name: Plantations
    description: Plantation/estate master records
  - name: Divisions
    description: Organizational divisions within a plantation
  - name: Fields
    description: Core operational unit — field/block with single clone and planting year
  - name: Clones
    description: Rubber clone master catalog
  - name: Nurseries
    description: Nursery units (motherbud, polybag, ground)
  - name: Nursery Clones
    description: Clone-wise plant distribution within nurseries
  - name: Land Use
    description: Non-planted area classification per plantation
  - name: Field Lifecycle
    description: Field status transitions and tapping changes (append-only)
  - name: Annual Snapshots
    description: Point-in-time area allocation snapshots
  - name: Lookups
    description: Read-only reference data

# ════════════════════════════════════════════════════════════════════
# PATHS
# ════════════════════════════════════════════════════════════════════
paths:

  # ─────────────────────── PLANTATIONS ───────────────────────
  /plantations:
    get:
      tags: [Plantations]
      summary: List plantations
      operationId: listPlantations
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: region
          in: query
          schema: { type: string }
          description: Filter by region (exact match)
        - name: district
          in: query
          schema: { type: string }
          description: Filter by district (exact match)
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, DECOMMISSIONED] }
        - name: search
          in: query
          schema: { type: string }
          description: Search by plantation code or name (case-insensitive contains)
        - $ref: '#/components/parameters/LatParam'
        - $ref: '#/components/parameters/LonParam'
        - $ref: '#/components/parameters/RadiusKmParam'
      responses:
        '200':
          description: Paginated list of plantations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPlantationResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Plantations]
      summary: Create a plantation
      operationId: createPlantation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlantationCreateRequest' }
      responses:
        '201':
          description: Plantation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlantationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /plantations/{plantationId}:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
    get:
      tags: [Plantations]
      summary: Get plantation by ID
      operationId: getPlantation
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlantationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Plantations]
      summary: Update a plantation
      operationId: updatePlantation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlantationUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlantationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Plantations]
      summary: Soft-delete (decommission) a plantation
      operationId: deletePlantation
      responses:
        '204': { description: Plantation decommissioned }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /plantations/{plantationId}/area-summary:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
    get:
      tags: [Plantations]
      summary: Get plantation area summary (from vw_plantation_area_summary)
      operationId: getPlantationAreaSummary
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlantationAreaSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── DIVISIONS ───────────────────────
  /plantations/{plantationId}/divisions:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
    get:
      tags: [Divisions]
      summary: List divisions for a plantation
      operationId: listDivisions
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedDivisionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Divisions]
      summary: Create a division
      operationId: createDivision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DivisionCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DivisionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /plantations/{plantationId}/divisions/{divisionId}:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
      - $ref: '#/components/parameters/DivisionIdPath'
    get:
      tags: [Divisions]
      summary: Get division by ID
      operationId: getDivision
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DivisionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Divisions]
      summary: Update a division
      operationId: updateDivision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DivisionUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DivisionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── FIELDS ───────────────────────
  /plantations/{plantationId}/fields:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
    get:
      tags: [Fields]
      summary: List fields for a plantation
      operationId: listFields
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: divisionId
          in: query
          schema: { type: integer }
          description: Filter by division
        - name: fieldCategory
          in: query
          schema: { type: string, enum: [NEW_CLEARING, REPLANTING, MATURE] }
        - name: cloneCode
          in: query
          schema: { type: string }
          description: Filter by clone code (exact)
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, FALLOW, DECOMMISSIONED] }
        - name: plantingYearFrom
          in: query
          schema: { type: integer }
        - name: plantingYearTo
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/LatParam'
        - $ref: '#/components/parameters/LonParam'
        - $ref: '#/components/parameters/RadiusKmParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedFieldResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Fields]
      summary: Create a field
      operationId: createField
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /plantations/{plantationId}/fields/{fieldId}:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
      - $ref: '#/components/parameters/FieldIdPath'
    get:
      tags: [Fields]
      summary: Get field by ID
      operationId: getField
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Fields]
      summary: Update a field
      operationId: updateField
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /plantations/{plantationId}/fields/immature:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
    get:
      tags: [Fields]
      summary: List immature fields (from vw_immature_fields)
      operationId: listImmatureFields
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedImmatureFieldResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /plantations/{plantationId}/fields/mature:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
    get:
      tags: [Fields]
      summary: List mature fields (from vw_mature_fields)
      operationId: listMatureFields
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedMatureFieldResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── FIELD LIFECYCLE ───────────────────────
  /plantations/{plantationId}/fields/{fieldId}/lifecycle:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
      - $ref: '#/components/parameters/FieldIdPath'
    get:
      tags: [Field Lifecycle]
      summary: List lifecycle events for a field
      operationId: listFieldLifecycleEvents
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: eventType
          in: query
          schema:
            type: string
            enum: [PLANTED, OPENED_FOR_TAPPING, PANEL_CHANGE, SYSTEM_CHANGE, FALLOW, REPLANTING_STARTED, DECOMMISSIONED]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedFieldLifecycleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Field Lifecycle]
      summary: Record a lifecycle event (append-only)
      description: |
        Lifecycle events are immutable audit records. Once created, they cannot
        be updated or deleted. This endpoint supports POST only.
      operationId: createFieldLifecycleEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldLifecycleCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldLifecycleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── CLONES ───────────────────────
  /clones:
    get:
      tags: [Clones]
      summary: List all rubber clones
      operationId: listClones
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: cloneClass
          in: query
          schema: { type: string, enum: ['I', 'II', 'III'] }
        - name: search
          in: query
          schema: { type: string }
          description: Search by clone code or name
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedCloneResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Clones]
      summary: Create a clone
      operationId: createClone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloneCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloneResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /clones/{cloneId}:
    parameters:
      - name: cloneId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Clones]
      summary: Get clone by ID
      operationId: getClone
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloneResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Clones]
      summary: Update a clone
      operationId: updateClone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloneUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloneResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /clones/distribution-summary:
    get:
      tags: [Clones]
      summary: Clone distribution across plantations (from vw_clone_distribution_summary)
      operationId: getCloneDistributionSummary
      parameters:
        - name: plantationId
          in: query
          schema: { type: integer }
          description: Filter by plantation (optional — all plantations if omitted)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CloneDistributionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── NURSERIES ───────────────────────
  /plantations/{plantationId}/nurseries:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
    get:
      tags: [Nurseries]
      summary: List nurseries for a plantation
      operationId: listNurseries
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: nurseryType
          in: query
          schema: { type: string }
          description: Filter by nursery type code (e.g., MOTHERBUD, POLYBAG)
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, CLOSED] }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedNurseryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Nurseries]
      summary: Create a nursery
      operationId: createNursery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NurseryCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NurseryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /plantations/{plantationId}/nurseries/{nurseryId}:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
      - name: nurseryId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Nurseries]
      summary: Get nursery by ID
      operationId: getNursery
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NurseryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Nurseries]
      summary: Update a nursery
      operationId: updateNursery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NurseryUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NurseryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── NURSERY CLONE DISTRIBUTION ───────────────────────
  /plantations/{plantationId}/nurseries/{nurseryId}/clone-distributions:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
      - name: nurseryId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Nursery Clones]
      summary: List clone distributions in a nursery
      operationId: listNurseryCloneDistributions
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedNurseryCloneDistributionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Nursery Clones]
      summary: Record a clone distribution entry
      operationId: createNurseryCloneDistribution
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NurseryCloneDistributionCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NurseryCloneDistributionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /plantations/{plantationId}/nurseries/{nurseryId}/clone-distributions/{distributionId}:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
      - name: nurseryId
        in: path
        required: true
        schema: { type: integer }
      - name: distributionId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Nursery Clones]
      summary: Update a clone distribution entry
      operationId: updateNurseryCloneDistribution
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NurseryCloneDistributionUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NurseryCloneDistributionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── LAND USE ───────────────────────
  /plantations/{plantationId}/land-use:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
    get:
      tags: [Land Use]
      summary: List land use allocations for a plantation
      operationId: listLandUse
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: landUseCode
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedLandUseResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Land Use]
      summary: Add a land use allocation
      operationId: createLandUse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LandUseCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandUseResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /plantations/{plantationId}/land-use/{landUseId}:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
      - name: landUseId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Land Use]
      summary: Update a land use allocation
      operationId: updateLandUse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LandUseUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandUseResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Land Use]
      summary: Remove a land use allocation
      operationId: deleteLandUse
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── ANNUAL SNAPSHOTS ───────────────────────
  /plantations/{plantationId}/annual-snapshots:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
    get:
      tags: [Annual Snapshots]
      summary: List annual area snapshots
      operationId: listAnnualSnapshots
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: snapshotYear
          in: query
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedAnnualSnapshotResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Annual Snapshots]
      summary: Create an annual snapshot
      operationId: createAnnualSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnualSnapshotCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnualSnapshotResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── LOOKUPS ───────────────────────
  /lookups/measurement-units:
    get:
      tags: [Lookups]
      summary: List measurement units
      operationId: listMeasurementUnits
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LookupItem' }

  /lookups/land-use-types:
    get:
      tags: [Lookups]
      summary: List land use types (hierarchical)
