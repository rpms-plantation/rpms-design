openapi: 3.0.3
info:
  title: RPMS Tree Service API
  description: |
    Module 2 — Tree Records & Tracking.
    Manages individual rubber tree registration, NFC/RFID/QR tag scanning,
    growth measurements, bark panel history, health inspections, disease
    incidents, treatments, mortality records, and field-level census summaries.

    **Spatial**: PostGIS Point on each tree (auto-synced from lat/lon by a DB
    trigger). GPS coordinates exposed as latitude/longitude pairs in DTOs.

    **Framework**: Spring Boot 3 + Java 21 (ADR-002)
    **Database**: PostgreSQL 16 + PostGIS (ADR-001)
    **Repo**: rpms-mod-tree
    **Depends on**: Module 1 (plantation, field, clone_master, nursery)
  version: 1.0.0
  contact:
    name: RPMS Architecture Team
  license:
    name: Proprietary

servers:
  - url: /api/tree
    description: Behind API Gateway (rpms-platform)

security:
  - BearerAuth: []

tags:
  - name: Trees
    description: Individual rubber tree master records — the core entity
  - name: Tree Rows
    description: Row-level organization within a field
  - name: Tree Tags
    description: NFC/RFID/QR tag registration and field scanning
  - name: Growth Measurements
    description: Time-series girth, bark, height measurements
  - name: Panel History
    description: Tapping panel progression per tree
  - name: Health Inspections
    description: Periodic field health assessments
  - name: Disease Incidents
    description: Disease/pest occurrence tracking
  - name: Treatments
    description: Treatments applied to trees
  - name: Mortality
    description: Tree death/removal records
  - name: Census
    description: Field-level periodic tree census summaries
  - name: Analytics
    description: Cross-tree analytical views
  - name: Lookups
    description: Read-only reference data

# ════════════════════════════════════════════════════════════════════
# PATHS
# ════════════════════════════════════════════════════════════════════
paths:

  # ─────────────────────── TREE ROWS ───────────────────────
  /plantations/{plantationId}/fields/{fieldId}/rows:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
      - $ref: '#/components/parameters/FieldIdPath'
    get:
      tags: [Tree Rows]
      summary: List rows for a field
      operationId: listTreeRows
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedTreeRowResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tree Rows]
      summary: Create a tree row
      operationId: createTreeRow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreeRowCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeRowResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /plantations/{plantationId}/fields/{fieldId}/rows/{rowId}:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
      - $ref: '#/components/parameters/FieldIdPath'
      - name: rowId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Tree Rows]
      summary: Get row by ID
      operationId: getTreeRow
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeRowResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── TREES ───────────────────────
  /trees:
    get:
      tags: [Trees]
      summary: List trees (filterable across plantation/field/status)
      operationId: listTrees
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: plantationId
          in: query
          schema: { type: integer }
        - name: fieldId
          in: query
          schema: { type: integer }
        - name: rowId
          in: query
          schema: { type: integer }
        - name: cloneCode
          in: query
          schema: { type: string }
        - name: treeStatus
          in: query
          schema: { type: string }
          description: Lookup code from lu_tree_status
        - name: healthRating
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/LatParam'
        - $ref: '#/components/parameters/LonParam'
        - $ref: '#/components/parameters/RadiusKmParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedTreeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Trees]
      summary: Register a new tree
      operationId: createTree
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreeCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /trees/{treeId}:
    parameters:
      - $ref: '#/components/parameters/TreeIdPath'
    get:
      tags: [Trees]
      summary: Get tree by ID
      operationId: getTree
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Trees]
      summary: Update a tree
      operationId: updateTree
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreeUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trees/{treeId}/profile:
    parameters:
      - $ref: '#/components/parameters/TreeIdPath'
    get:
      tags: [Trees]
      summary: Get full tree profile (from vw_tree_profile)
      operationId: getTreeProfile
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trees/{treeId}/status-history:
    parameters:
      - $ref: '#/components/parameters/TreeIdPath'
    get:
      tags: [Trees]
      summary: List status change history (immutable — auto-logged by DB trigger on status change)
      operationId: listTreeStatusHistory
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedTreeStatusLogResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── TREE TAGS ───────────────────────
  /trees/{treeId}/tags:
    parameters:
      - $ref: '#/components/parameters/TreeIdPath'
    get:
      tags: [Tree Tags]
      summary: List tags attached to a tree
      operationId: listTreeTags
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedTreeTagResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tree Tags]
      summary: Register a new tag on a tree
      operationId: createTreeTag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreeTagCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeTagResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tags/{tagUid}/scan:
    parameters:
      - name: tagUid
        in: path
        required: true
        schema: { type: string }
        description: Physical tag UID scanned by mobile device (NFC/RFID/QR)
    post:
      tags: [Tree Tags]
      summary: Record a field scan and resolve the tree behind the tag
      description: |
        Called by the mobile app when a tapper/supervisor scans a tree's NFC/RFID/QR tag.
        Increments the tag's scan counter and returns the associated tree profile.
      operationId: scanTreeTag
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── GROWTH MEASUREMENTS ───────────────────────
  /trees/{treeId}/growth-measurements:
    parameters:
      - $ref: '#/components/parameters/TreeIdPath'
    get:
      tags: [Growth Measurements]
      summary: List growth measurements for a tree
      operationId: listGrowthMeasurements
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: parameterCode
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedGrowthMeasurementResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Growth Measurements]
      summary: Record a growth measurement
      description: |
        Recording a GIRTH, BARK_THICKNESS, or BARK_CONSUMPTION measurement
        auto-updates the tree's denormalized current_girth_cm / current_bark_mm /
        bark_consumption_pct fields via a DB trigger.
      operationId: createGrowthMeasurement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrowthMeasurementCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthMeasurementResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── PANEL HISTORY ───────────────────────
  /trees/{treeId}/panels:
    parameters:
      - $ref: '#/components/parameters/TreeIdPath'
    get:
      tags: [Panel History]
      summary: List bark panel history for a tree
      operationId: listTreePanels
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedTreePanelResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Panel History]
      summary: Open a new tapping panel on a tree
      operationId: createTreePanel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreePanelCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreePanelResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /trees/{treeId}/panels/{panelHistoryId}:
    parameters:
      - $ref: '#/components/parameters/TreeIdPath'
      - name: panelHistoryId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Panel History]
      summary: Update / close a tapping panel
      operationId: updateTreePanel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreePanelUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreePanelResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── HEALTH INSPECTIONS ───────────────────────
  /trees/{treeId}/health-inspections:
    parameters:
      - $ref: '#/components/parameters/TreeIdPath'
    get:
      tags: [Health Inspections]
      summary: List health inspections for a tree
      operationId: listHealthInspections
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedHealthInspectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Health Inspections]
      summary: Record a health inspection (immutable — append-only)
      operationId: createHealthInspection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthInspectionCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthInspectionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── DISEASE INCIDENTS ───────────────────────
  /trees/{treeId}/disease-incidents:
    parameters:
      - $ref: '#/components/parameters/TreeIdPath'
    get:
      tags: [Disease Incidents]
      summary: List disease incidents for a tree
      operationId: listDiseaseIncidents
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, UNDER_TREATMENT, RESOLVED, CHRONIC, FATAL] }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedDiseaseIncidentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Disease Incidents]
      summary: Report a disease incident
      operationId: createDiseaseIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiseaseIncidentCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiseaseIncidentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /trees/{treeId}/disease-incidents/{incidentId}:
    parameters:
      - $ref: '#/components/parameters/TreeIdPath'
      - name: incidentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Disease Incidents]
      summary: Update / resolve a disease incident
      operationId: updateDiseaseIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiseaseIncidentUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiseaseIncidentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── TREATMENTS ───────────────────────
  /trees/{treeId}/treatments:
    parameters:
      - $ref: '#/components/parameters/TreeIdPath'
    get:
      tags: [Treatments]
      summary: List treatments applied to a tree
      operationId: listTreatments
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedTreatmentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Treatments]
      summary: Record a treatment applied to a tree
      operationId: createTreatment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreatmentCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreatmentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── MORTALITY ───────────────────────
  /trees/{treeId}/mortality:
    parameters:
      - $ref: '#/components/parameters/TreeIdPath'
    get:
      tags: [Mortality]
      summary: Get the mortality record for a tree (one per dead/removed tree)
      operationId: getMortalityRecord
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MortalityResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Mortality]
      summary: Record tree death or removal
      description: |
        Recording a mortality record transitions the tree's status to DEAD or
        REMOVED. The DB enforces mortality_date is set whenever a tree carries
        either status.
      operationId: createMortalityRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MortalityCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MortalityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─────────────────────── CENSUS ───────────────────────
  /plantations/{plantationId}/fields/{fieldId}/census:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
      - $ref: '#/components/parameters/FieldIdPath'
    get:
      tags: [Census]
      summary: List census records for a field
      operationId: listCensusRecords
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: censusYear
          in: query
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedCensusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Census]
      summary: Record a field tree census
      operationId: createCensusRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CensusCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CensusResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /plantations/{plantationId}/fields/{fieldId}/tree-summary:
    parameters:
      - $ref: '#/components/parameters/PlantationIdPath'
      - $ref: '#/components/parameters/FieldIdPath'
    get:
      tags: [Census]
      summary: Get live field tree summary (from vw_field_tree_summary)
      operationId: getFieldTreeSummary
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldTreeSummaryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── ANALYTICS ───────────────────────
  /disease-hotspots:
    get:
      tags: [Analytics]
      summary: Disease hotspot analysis (from vw_disease_hotspot)
      operationId: getDiseaseHotspots
      parameters:
        - name: plantationCode
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DiseaseHotspotResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mortality-analysis:
    get:
      tags: [Analytics]
      summary: Mortality analysis (from vw_mortality_analysis)
      operationId: getMortalityAnalysis
      parameters:
        - name: plantationCode
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MortalityAnalysisResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────── LOOKUPS ───────────────────────
  /lookups/tree-statuses:
    get:
      tags: [Lookups]
      summary: List tree lifecycle statuses
      operationId: listTreeStatuses
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TreeStatusLookup' }

  /lookups/health-ratings:
    get:
      tags: [Lookups]
      summary: List health ratings
      operationId: listHealthRatings
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HealthRatingLookup' }

  /lookups/diseases:
    get:
      tags: [Lookups]
      summary: List disease/pest catalog
      operationId: listDiseases
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DiseaseLookup' }

  /lookups/treatment-types:
    get:
      tags: [Lookups]
      summary: List treatment types
      operationId: listTreatmentTypes
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TreatmentTypeLookup' }

  /lookups/growth-parameters:
    get:
      tags: [Lookups]
      summary: List growth parameters
      operationId: listGrowthParameters
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GrowthParameterLookup' }

  /lookups/tag-types:
    get:
      tags: [Lookups]
      summary: List IoT tag types
      operationId: listTagTypes
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TagTypeLookup' }

  /lookups/mortality-causes:
    get:
      tags: [Lookups]
      summary: List mortality causes
      operationId: listMortalityCauses
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MortalityCauseLookup' }

# ════════════════════════════════════════════════════════════════════
# COMPONENTS
# ════════════════════════════════════════════════════════════════════
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued JWT token

  # ─────────────── SHARED PARAMETERS ───────────────
  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
      description: Zero-based page number
    SizeParam:
      name: size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      description: Page size
    SortParam:
      name: sort
      in: query
      schema: { type: string }
      description: 'Sort field and direction (e.g., plantingYear,desc)'
    LatParam:
      name: lat
      in: query
      schema: { type: number, format: double, minimum: -90, maximum: 90 }
      description: Latitude for spatial proximity filter
    LonParam:
      name: lon
      in: query
      schema: { type: number, format: double, minimum: -180, maximum: 180 }
      description: Longitude for spatial proximity filter
    RadiusKmParam:
      name: radiusKm
      in: query
      schema: { type: number, format: double, default: 10 }
      description: Search radius in kilometers (requires lat + lon)
    PlantationIdPath:
      name: plantationId
      in: path
      required: true
      schema: { type: integer }
    FieldIdPath:
      name: fieldId
      in: path
      required: true
      schema: { type: integer }
    TreeIdPath:
      name: treeId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  # ─────────────── SHARED RESPONSES ───────────────
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Duplicate resource (unique constraint violation)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

